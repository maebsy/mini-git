name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Run example sessions
        run: for f in examples/*.txt; do python main.py --hash-mode counter --fake-time "2024-01-15 09:00:00" --time-step 900 < "$f" > /dev/null; done
